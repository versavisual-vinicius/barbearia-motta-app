<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Motta — Portal do Cliente</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=DM+Serif+Display&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns=%27http://www.w3.org/2000/svg%27 viewBox=%270 0 32 32%27%3E%3Crect width=%2732%27 height=%2732%27 rx=%278%27 fill=%27%2315552D%27/%3E%3Ctext x=%2716%27 y=%2723%27 font-size=%2720%27 text-anchor=%27middle%27 fill=%27%23C7A566%27 font-family=%27serif%27%3EM%3C/text%3E%3C/svg%3E">
<link rel="stylesheet" href="styles.css">
</head>
<body>
<div class="app">
  <div id="toast" role="status" aria-live="polite"></div>
  <main id="view" tabindex="-1"></main>
  <nav aria-label="Principal">
    <a href="#/inicio"><svg viewBox="0 0 24 24"><path d="M3 11l9-8 9 8v9a1 1 0 0 1-1 1h-5v-6H9v6H4a1 1 0 0 1-1-1z"/></svg>Início</a>
    <a href="#/agendamentos"><svg viewBox="0 0 24 24"><rect x="3" y="5" width="18" height="16" rx="2"/><path d="M3 10h18M8 3v4M16 3v4"/></svg>Agendamentos</a>
    <a href="#/clube"><svg viewBox="0 0 24 24"><path d="M12 3l2.7 5.6 6.1.9-4.4 4.3 1 6.1L12 17l-5.4 2.9 1-6.1L3.2 9.500l6.100-.9z"/></svg>Clube</a>
    <a href="#/planos"><svg viewBox="0 0 24 24"><rect x="3" y="6" width="18" height="12" rx="2"/><path d="M3 10h18"/></svg>Planos</a>
    <a href="#/perfil"><svg viewBox="0 0 24 24"><circle cx="12" cy="8" r="4"/><path d="M4 21c0-4 4-6 8-6s8 2 8 6"/></svg>Perfil</a>
  </nav>
  <dialog id="cancel" aria-labelledby="ct" closedby="any">
    <h2 id="ct">Cancelar este agendamento?</h2>
    <p class="body" style="margin-bottom:16px">Cancelamento gratuito até 2 horas antes. Sua cota do Clube Gold será devolvida imediatamente.</p>
    <form method="dialog" class="col gap8">
      <button class="btn" value="keep" autofocus>Voltar e manter agendamento</button>
      <button class="btn primary" value="cancel">Confirmar cancelamento</button>
    </form>
  </dialog>
</div>
<script src="app.js"></script>
</body>
</html>
